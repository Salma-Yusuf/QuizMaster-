{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="narrow">
  <h1 style="font-size:2rem">Log in</h1>
  <form class="card" method="post" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field"><button class="btn" type="submit" style="width:100%">Log in</button></div>
  </form>
  <p class="muted" style="margin-top:1rem">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
