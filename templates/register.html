{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="narrow">
  <h1 style="font-size:2rem">Create your account</h1>
  <form class="card" method="post" novalidate>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" value="{{ form.get('name','') }}" autocomplete="name" required autofocus>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ form.get('username','') }}" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
      <div class="hint">At least 6 characters.</div>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    </div>
    <div class="field"><button class="btn" type="submit" style="width:100%">Create account</button></div>
  </form>
  <p class="muted" style="margin-top:1rem">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
